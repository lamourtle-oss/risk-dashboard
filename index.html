    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iters,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.nonce)},key,b64(P.ct));
    const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    const FIX='<scr'+'ipt>window.fixPanel=function(p){if(!p)return;for(var i in Chart.instances){var c=Chart.instances[i];if(p.contains(c.canvas)){try{c.resize();c.update(\'none\');c.render();}catch(e){}}}};window.bump=function(p){[0,150,450,900,1600].forEach(function(d){setTimeout(function(){window.fixPanel(p)},d)})};document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active")});document.querySelectorAll(".panel").forEach(function(x){x.classList.remove("active")});t.classList.add("active");var p=document.getElementById(t.dataset.p);p.classList.add("active");window.bump(p)}});window.addEventListener("resize",function(){window.bump(document.querySelector(".panel.active"))});window.bump(document.querySelector(".panel.active"));<\/scr'+'ipt>';
    const out = html.indexOf('</body>')>0 ? html.replace('</body>', FIX+'</body>') : html+FIX;
    try{sessionStorage.setItem('__salt',P.salt);}catch(e){}
    document.open(); document.write(out); document.close();
  }catch(e){ err.textContent='รหัสผ่านไม่ถูกต้อง'; }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
