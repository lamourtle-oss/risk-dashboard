const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function go(){
  const err=document.getElementById('err'); err.textContent='กำลังถอดรหัส...';
  try{
    const pw=document.getElementById('pw').value;
    const keyMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iters,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.nonce)},key,b64(P.ct));
    const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){ err.textContent='รหัสผ่านไม่ถูกต้อง'; }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
